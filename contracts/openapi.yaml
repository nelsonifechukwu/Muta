openapi: 3.1.0
info:
  title: Muta — Offline Adaptive Tutor
  description: ADTC 2026. The only public surface is the versioned /v1 contract; every client — browser,
    phones, eval.py, CLI — speaks only /v1.
  version: 0.1.0
paths:
  /v1/health:
    get:
      tags:
      - ops
      summary: Health
      operationId: health_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/ready:
    get:
      tags:
      - ops
      summary: Ready
      description: 'Probes engine + db directly from config, never through `get_engine()` — readiness

        must report a down dependency, not hang constructing a store against it. Always HTTP

        200; the compose healthcheck greps the body for `"ready":true`.'
      operationId: ready_v1_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /v1/chat:
    post:
      tags:
      - tutor
      summary: Chat
      description: 'Multi-turn tutoring turn. Memory is keyed by `conversation_id`; omit it to start a

        new thread. The mode selects the system prompt (ROADMAP 18 Jul, stable-prefix design).'
      operationId: chat_v1_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/chat/stream:
    post:
      tags:
      - tutor
      summary: Chat Stream
      description: 'Token-streaming twin of `/chat` — the browser UI''s primary path.


        Emits Server-Sent Events: a leading `{"conversation_id": "..."}`, then

        `{"reasoning": "..."}` for Qwen3 thinking tokens and `{"delta": "..."}` for answer

        tokens, then a final

        `{"done": true, "conversation_id", "completion_tokens", "elapsed_s", "tokens_per_second"}`.


        Admission-controlled on the student''s session so the classroom demo (30 phones, 2 engine

        slots) queues gracefully with a ''you''re next'' message instead of piling unbounded

        concurrent streams onto the engine — the exact path production traffic takes.'
      operationId: chat_stream_v1_chat_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: SSE token stream
          content:
            application/json:
              schema: {}
            text/event-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/conversations:
    get:
      tags:
      - conversations
      summary: Conversations
      description: 'A student''s threads, most recently active first — the UI sidebar. A caller only sees

        their own threads; the query id must match the authenticated identity.'
      operationId: conversations_v1_conversations_get
      parameters:
      - name: student_id
        in: query
        required: true
        schema:
          type: string
          title: Student Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/conversations/{conversation_id}/messages:
    get:
      tags:
      - conversations
      summary: Conversation Messages
      description: 'Full history with attachment refs — how the UI reloads a thread after a restart. Scoped

        to the owner: a thread the caller does not own is indistinguishable from a missing one.'
      operationId: conversation_messages_v1_conversations__conversation_id__messages_get
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/conversations/{conversation_id}/telemetry:
    get:
      tags:
      - ops
      summary: Conversation Telemetry
      description: One-shot telemetry snapshot (curl-able twin of the SSE stream below).
      operationId: conversation_telemetry_v1_conversations__conversation_id__telemetry_get
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetrySnapshot'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/conversations/{conversation_id}/telemetry/stream:
    get:
      tags:
      - ops
      summary: Conversation Telemetry Stream
      description: '1 Hz telemetry SSE. Async generator on purpose: a sync generator would pin a

        threadpool thread per open strip. GET, so the browser''s native EventSource works.'
      operationId: conversation_telemetry_stream_v1_conversations__conversation_id__telemetry_stream_get
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '200':
          description: 1 Hz SSE telemetry
          content:
            application/json:
              schema: {}
            text/event-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/conversations/{conversation_id}:
    delete:
      tags:
      - conversations
      summary: Conversation Delete
      description: 'Delete one of the caller''s own threads. 404 (not a false success) when the caller
        does

        not own it or it does not exist — a client cannot destroy another student''s history.'
      operationId: conversation_delete_v1_conversations__conversation_id__delete
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDeleted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/attachments/{attachment_id}:
    get:
      tags:
      - conversations
      summary: Attachment
      description: 'Serve an attachment the caller owns. Ownership is checked at the store (owner or the

        owner of the linked conversation); a miss is a 404, so ids stay non-probeable. Served as an

        inert `nosniff` download with a whitelisted content type (never the client-set one).'
      operationId: attachment_v1_attachments__attachment_id__get
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: integer
          title: Attachment Id
      - name: token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Raw bytes
          content:
            application/octet-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/session:
    post:
      tags:
      - ops
      summary: Auth Session
      description: 'Mint a bearer token for a per-device learner id. With MUTA_AUTH_SECRET set the token
        is

        HMAC-signed (unforgeable); without it the token is the id itself (opaque per-device

        secret). The client sends it as `Authorization: Bearer <token>` on data endpoints.'
      operationId: auth_session_v1_auth_session_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/students/{student_id}:
    delete:
      tags:
      - ops
      summary: Student Erase
      description: 'Data-subject erasure: delete everything owned by a student (conversations + cascaded

        messages/attachments, owned orphan attachments, settings). A caller may only erase their

        own data. Returns the removed counts as a receipt.'
      operationId: student_erase_v1_students__student_id__delete
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentErased'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/diagnose:
    post:
      tags:
      - tutor
      summary: Diagnose
      description: 'A student''s weak spots + a concrete practice plan, from their learning twin. Mastery
        is

        only ever populated by real evidence (checked exam answers, §exam/answer), so a brand-new

        student gets a fundamentals-first starter plan rather than an invented weakness.'
      operationId: diagnose_v1_diagnose_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnoseRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnoseResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/generate_question:
    post:
      tags:
      - exam
      summary: Generate Question
      description: 'WAEC/WASSCE-style items from the offline question bank (orchestrator/exam/bank.py),

        filtered by subject/topic/difficulty. Deterministic for a given request.'
      operationId: generate_question_v1_generate_question_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateQuestionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateQuestionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/mastery/{student_id}:
    get:
      tags:
      - tutor
      summary: Mastery
      description: The student's mastery map + next-best topic, from their learning twin.
      operationId: mastery_v1_mastery__student_id__get
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      - name: subject
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Subject'
          default: math
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasteryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/exam/answer:
    post:
      tags:
      - exam
      summary: Exam Answer
      description: 'Score a student''s answer against the known-correct one and move their mastery on
        that

        topic — the honest evidence path that makes /mastery and /diagnose real. Mastery only

        changes when the sandbox actually returned a verdict (checked); an undecidable check

        leaves the record untouched rather than punishing the student for the tool''s limits.'
      operationId: exam_answer_v1_exam_answer_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamAnswerRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerCheckResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/verify:
    post:
      tags:
      - math
      summary: Verify
      description: 'Check a claim of the form `lhs == rhs` (or `lhs = rhs`) in the SymPy sandbox.


        The single-expression shape this endpoint has always had; `/tutor/verify` is the

        two-sided form the tool loop uses.'
      operationId: verify_v1_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tutor/chat:
    post:
      tags:
      - tutor
      summary: Tutor Chat
      description: 'One tutoring turn, admission-controlled (§8.2) and ladder-aware (§5.3).


        Set `stream: false` for this JSON shape; `stream: true` (the default) is served by

        `/tutor/chat/stream`, which speaks SSE. Both take the same body.'
      operationId: tutor_chat_v1_tutor_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatTurn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorReply'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tutor/chat/stream:
    post:
      tags:
      - tutor
      summary: Tutor Chat Stream
      description: 'Token-streaming twin of `/tutor/chat` (§7.2: the tutoring turn is SSE).


        Events: `{"reasoning": …}` while the model thinks, `{"delta": …}` per answer token, then

        a final `{"done": true, …}`. Time-to-first-token is the number a student feels (SC-3:

        < 2.5 s), so the stream starts before the answer is finished, not after.'
      operationId: tutor_chat_stream_v1_tutor_chat_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatTurn'
        required: true
      responses:
        '200':
          description: SSE token stream
          content:
            application/json:
              schema: {}
            text/event-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tutor/vision:
    post:
      tags:
      - tutor
      summary: Tutor Vision
      description: 'Photo of handwritten work → transcription (S2).


        Two refusals, both friendly: the image guard (too big, wrong format) and the ladder

        (no memory for a vision instance). Neither is an error — the student is told to type the

        problem instead, and the tutor keeps working.'
      operationId: tutor_vision_v1_tutor_vision_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_tutor_vision_v1_tutor_vision_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisionReply'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tutor/verify:
    post:
      tags:
      - math
      summary: Tutor Verify
      description: 'Candidate vs expected, via SymPy in the sandbox (§7.5).


        `checked=False` means no verdict was possible (no answer found, sandbox down) — the

        caller must not report that as "wrong".'
      operationId: tutor_verify_v1_tutor_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerCheckRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerCheckResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tutor/render:
    post:
      tags:
      - tutor
      summary: Tutor Render
      description: 'Model-emitted plotting code → SVG, sandboxed (§7.5, S5). A failure returns `ok=False`

        with the error, never a broken image.'
      operationId: tutor_render_v1_tutor_render_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/session/{session_id}/suspend:
    post:
      tags:
      - ops
      summary: Session Suspend
      description: Persist a session's KV and free its slot (§8.3).
      operationId: session_suspend_v1_session__session_id__suspend_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionActionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/session/{session_id}/resume:
    post:
      tags:
      - ops
      summary: Session Resume
      description: Bind a slot for a session, restoring its snapshot when one survives.
      operationId: session_resume_v1_session__session_id__resume_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionActionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/metrics:
    get:
      tags:
      - ops
      summary: Metrics
      description: 'Local health panel data (§12). All local: no exporter, no network, no dashboards.'
      operationId: metrics_v1_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
  /v1/audio/transcribe:
    post:
      tags:
      - audio
      summary: Audio Transcribe
      description: 'Uploaded audio → text. 503 when ASR is unavailable (the UI tells the student to

        type instead), 422 when ffmpeg can''t decode the file, 413 when the upload is too large.'
      operationId: audio_transcribe_v1_audio_transcribe_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_audio_transcribe_v1_audio_transcribe_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscribeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AnswerCheckRequest:
      properties:
        candidate:
          type: string
          title: Candidate
          description: The answer to check — bare, boxed, or inside prose.
        expected:
          type: string
          title: Expected
        tolerance:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Tolerance
          description: Relative tolerance; 0 = exact.
          default: 0.0
      type: object
      required:
      - candidate
      - expected
      title: AnswerCheckRequest
    AnswerCheckResponse:
      properties:
        verified:
          type: boolean
          title: Verified
        checked:
          type: boolean
          title: Checked
          description: False when no verdict was possible — not the same as wrong.
        normalized_candidate:
          type: string
          title: Normalized Candidate
          default: ''
        normalized_expected:
          type: string
          title: Normalized Expected
          default: ''
        detail:
          type: string
          title: Detail
          default: ''
      type: object
      required:
      - verified
      - checked
      title: AnswerCheckResponse
    AttachmentRef:
      properties:
        id:
          type: integer
          title: Id
        kind:
          type: string
          enum:
          - image
          - audio
          title: Kind
        mime:
          type: string
          title: Mime
      type: object
      required:
      - id
      - kind
      - mime
      title: AttachmentRef
    AuthTokenRequest:
      properties:
        student_id:
          type: string
          maxLength: 128
          title: Student Id
          description: The per-device learner id to bind.
      type: object
      required:
      - student_id
      title: AuthTokenRequest
    AuthTokenResponse:
      properties:
        student_id:
          type: string
          title: Student Id
        token:
          type: string
          title: Token
          description: 'Bearer token for the /v1 data endpoints. Send as `Authorization: Bearer <token>`
            (or `?token=` on attachment URLs). Opaque; treat as a per-device secret.'
      type: object
      required:
      - student_id
      - token
      title: AuthTokenResponse
    Body_audio_transcribe_v1_audio_transcribe_post:
      properties:
        audio:
          type: string
          contentMediaType: application/octet-stream
          title: Audio
        conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Id
        student_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Student Id
      type: object
      required:
      - audio
      title: Body_audio_transcribe_v1_audio_transcribe_post
    Body_tutor_vision_v1_tutor_vision_post:
      properties:
        session_id:
          type: string
          title: Session Id
        image:
          type: string
          contentMediaType: application/octet-stream
          title: Image
        conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Id
      type: object
      required:
      - session_id
      - image
      title: Body_tutor_vision_v1_tutor_vision_post
    ChatRequest:
      properties:
        student_id:
          type: string
          maxLength: 128
          title: Student Id
          description: Stable per-learner id; keys the learning twin.
        message:
          type: string
          maxLength: 8000
          title: Message
        conversation_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Conversation Id
          description: Omit to start a new thread; pass to continue one (multi-turn memory).
        mode:
          $ref: '#/components/schemas/TutoringMode'
          default: socratic
        persona:
          $ref: '#/components/schemas/Persona'
          default: teacher
        subject:
          $ref: '#/components/schemas/Subject'
          default: math
        language:
          type: string
          maxLength: 16
          title: Language
          description: 'BCP-47-ish tag: en, fr, ha, yo, ig, sw, ar, am, zu.'
          default: en
        stream:
          type: boolean
          title: Stream
          description: When true the server replies with an SSE token stream instead.
          default: false
        thinking:
          anyOf:
          - type: string
            enum:
            - 'off'
            - auto
            - extended
          - type: 'null'
          title: Thinking
          description: 'Reasoning effort for this turn: ''off'' answers directly (no thinking, fastest),
            ''auto'' thinks first (default behaviour), ''extended'' thinks and gives a fuller answer.
            Null uses the server default.'
        regenerate:
          type: boolean
          title: Regenerate
          description: Re-answer the current last user turn WITHOUT adding a new user message. Used by
            'answer now' to replace an in-flight reply (e.g. skip the thinking phase).
          default: false
        use_web:
          type: boolean
          title: Use Web
          description: 'Opt-in web grounding: when the box is online and a search endpoint is configured,
            the answer is grounded with fresh snippets and their sources are returned. Ignored (silently)
            offline or unconfigured.'
          default: false
        attachment_ids:
          items:
            type: integer
          type: array
          maxItems: 32
          title: Attachment Ids
          description: Previously-uploaded attachments to link to this message.
      type: object
      required:
      - student_id
      - message
      title: ChatRequest
    ChatResponse:
      properties:
        student_id:
          type: string
          title: Student Id
        conversation_id:
          type: string
          title: Conversation Id
          description: Pass back in the next request to continue the thread.
        mode:
          $ref: '#/components/schemas/TutoringMode'
        reply:
          type: string
          title: Reply
        verified:
          type: boolean
          title: Verified
          description: Whether math in the reply was checked by the `math` service.
          default: false
        citations:
          items:
            type: string
          type: array
          title: Citations
          description: RAG source references.
      type: object
      required:
      - student_id
      - conversation_id
      - mode
      - reply
      title: ChatResponse
    ChatTurn:
      properties:
        session_id:
          type: string
          title: Session Id
          description: One student's tutoring session; keys slot + twin.
        text:
          type: string
          maxLength: 4096
          title: Text
          description: 'Input cap per turn (S12: prompt-bomb guard).'
        mode:
          $ref: '#/components/schemas/TutorMode'
          default: dialogue
        lang:
          type: string
          title: Lang
          default: en
        student_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Student Id
          description: Defaults to session_id when omitted.
        stream:
          type: boolean
          title: Stream
          description: Kept for client symmetry. Token streaming has its own path — POST /v1/tutor/chat/stream
            (text/event-stream) — because one operation cannot honestly declare two response media types
            in the schema.
          default: false
      type: object
      required:
      - session_id
      - text
      title: ChatTurn
    ConversationDeleted:
      properties:
        id:
          type: string
          title: Id
        deleted:
          type: boolean
          title: Deleted
          default: true
      type: object
      required:
      - id
      title: ConversationDeleted
    ConversationList:
      properties:
        conversations:
          items:
            $ref: '#/components/schemas/ConversationOut'
          type: array
          title: Conversations
      type: object
      title: ConversationList
    ConversationOut:
      properties:
        id:
          type: string
          title: Id
        student_id:
          type: string
          title: Student Id
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Mode
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - id
      - student_id
      - created_at
      - updated_at
      title: ConversationOut
    DiagnoseRequest:
      properties:
        student_id:
          type: string
          title: Student Id
        subject:
          $ref: '#/components/schemas/Subject'
          default: math
        topic:
          anyOf:
          - type: string
          - type: 'null'
          title: Topic
          description: Optional focus; otherwise diagnose broadly.
      type: object
      required:
      - student_id
      title: DiagnoseRequest
    DiagnoseResponse:
      properties:
        student_id:
          type: string
          title: Student Id
        weak_topics:
          items:
            type: string
          type: array
          title: Weak Topics
        plan:
          items:
            type: string
          type: array
          title: Plan
          description: Concrete next steps (e.g. 7-day).
      type: object
      required:
      - student_id
      title: DiagnoseResponse
    ExamAnswerRequest:
      properties:
        student_id:
          type: string
          maxLength: 128
          title: Student Id
        topic:
          type: string
          maxLength: 80
          title: Topic
          description: Curriculum topic the answer scores mastery on.
        candidate:
          type: string
          maxLength: 4096
          title: Candidate
          description: The student's submitted answer.
        expected:
          type: string
          maxLength: 4096
          title: Expected
          description: The correct answer (from the question).
        tolerance:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Tolerance
          default: 0.0
      type: object
      required:
      - student_id
      - topic
      - candidate
      - expected
      title: ExamAnswerRequest
      description: 'Score a student''s answer to a known question and move their mastery on that topic.
        The

        expected answer comes from the question bank, so this is real evidence — unlike free-chat

        volume, which never touches mastery.'
    GenerateQuestionRequest:
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
          default: math
        topic:
          type: string
          title: Topic
        difficulty:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Difficulty
          default: 3
        exam_board:
          type: string
          title: Exam Board
          default: WAEC
        count:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Count
          default: 1
      type: object
      required:
      - topic
      title: GenerateQuestionRequest
    GenerateQuestionResponse:
      properties:
        questions:
          items:
            $ref: '#/components/schemas/GeneratedQuestion'
          type: array
          title: Questions
      type: object
      title: GenerateQuestionResponse
    GeneratedQuestion:
      properties:
        question_text:
          type: string
          title: Question Text
        options:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Options
          description: Present for objective (Paper 1) items.
        correct_answer:
          type: string
          title: Correct Answer
        worked_solution:
          type: string
          title: Worked Solution
        marking_scheme:
          anyOf:
          - type: string
          - type: 'null'
          title: Marking Scheme
          description: Method + answer marks (Paper 2).
        topic_tags:
          items:
            type: string
          type: array
          title: Topic Tags
        difficulty:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Difficulty
          default: 3
      type: object
      required:
      - question_text
      - correct_answer
      - worked_solution
      title: GeneratedQuestion
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        service:
          type: string
          title: Service
        version:
          type: string
          title: Version
          description: Semantic version of the running build.
          default: 0.0.0
        git_sha:
          type: string
          title: Git Sha
          description: Commit the running image was built from.
          default: unknown
      type: object
      required:
      - service
      title: HealthResponse
    MasteryResponse:
      properties:
        student_id:
          type: string
          title: Student Id
        subject:
          $ref: '#/components/schemas/Subject'
        mastery:
          additionalProperties:
            type: number
          type: object
          title: Mastery
          description: topic_id -> mastery in [0, 1] on the curriculum DAG.
        next_topic:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Topic
          description: Next-best lesson given prerequisites.
      type: object
      required:
      - student_id
      - subject
      title: MasteryResponse
    MessageList:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
        messages:
          items:
            $ref: '#/components/schemas/MessageOut'
          type: array
          title: Messages
      type: object
      required:
      - conversation_id
      title: MessageList
    MessageOut:
      properties:
        id:
          type: integer
          title: Id
        role:
          type: string
          title: Role
        content:
          type: string
          title: Content
        created_at:
          type: string
          title: Created At
        attachments:
          items:
            $ref: '#/components/schemas/AttachmentRef'
          type: array
          title: Attachments
      type: object
      required:
      - id
      - role
      - content
      - created_at
      title: MessageOut
    Persona:
      type: string
      enum:
      - teacher
      - friend
      - professor
      - exam
      title: Persona
    ReadyResponse:
      properties:
        ready:
          type: boolean
          title: Ready
        checks:
          additionalProperties:
            type: boolean
          type: object
          title: Checks
          description: Per-dependency readiness (llama-server, sub-apps).
        online:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Online
          description: Internet reachability; null until the first probe completes.
      type: object
      required:
      - ready
      title: ReadyResponse
    RenderRequest:
      properties:
        kind:
          type: string
          enum:
          - matplotlib
          - svg
          title: Kind
          default: matplotlib
        code:
          type: string
          maxLength: 8192
          title: Code
      type: object
      required:
      - code
      title: RenderRequest
    RenderResponse:
      properties:
        svg:
          type: string
          title: Svg
          default: ''
        ok:
          type: boolean
          title: Ok
          default: true
        error:
          type: string
          title: Error
          default: ''
        fallback_text:
          type: string
          title: Fallback Text
          description: Description to show when rendering failed (S5).
          default: ''
      type: object
      title: RenderResponse
    SessionActionResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        action:
          type: string
          enum:
          - suspend
          - resume
          title: Action
        ok:
          type: boolean
          title: Ok
        detail:
          type: string
          title: Detail
          default: ''
      type: object
      required:
      - session_id
      - action
      - ok
      title: SessionActionResponse
    StudentErased:
      properties:
        student_id:
          type: string
          title: Student Id
        conversations:
          type: integer
          title: Conversations
          default: 0
        orphan_attachments:
          type: integer
          title: Orphan Attachments
          default: 0
        settings:
          type: integer
          title: Settings
          default: 0
      type: object
      required:
      - student_id
      title: StudentErased
      description: Result of a data-subject erasure — the counts removed, for an auditable receipt.
    Subject:
      type: string
      enum:
      - math
      - physics
      - chemistry
      - biology
      title: Subject
    SystemStatus:
      properties:
        degradation:
          additionalProperties: true
          type: object
          title: Degradation
        sessions:
          additionalProperties: true
          type: object
          title: Sessions
        vision:
          additionalProperties: true
          type: object
          title: Vision
        engine:
          additionalProperties: true
          type: object
          title: Engine
      type: object
      title: SystemStatus
      description: '`/v1/metrics` — the local health panel''s data (TDD §12). All local, no exporter.'
    TelemetrySnapshot:
      properties:
        rss_gb:
          type: number
          title: Rss Gb
          description: Current RSS of the whole backend process tree.
        peak_rss_gb:
          type: number
          title: Peak Rss Gb
          description: Peak tree RSS since the backend started.
        cpu_temp_c:
          anyOf:
          - type: number
          - type: 'null'
          title: Cpu Temp C
          description: CPU package temp; null if unreadable.
        throttled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Throttled
          description: temp > 85 °C; null when the temperature is unreadable.
        tokens_per_second:
          anyOf:
          - type: number
          - type: 'null'
          title: Tokens Per Second
          description: Rolling decode rate of this conversation's active generation.
        generating:
          type: boolean
          title: Generating
          default: false
      type: object
      required:
      - rss_gb
      - peak_rss_gb
      title: TelemetrySnapshot
      description: 'Per-conversation live telemetry. Unmeasurable metrics are null (the UI shows —),

        never an error: Docker-on-macOS has no CPU temperature, for example.'
    TranscribeResponse:
      properties:
        text:
          type: string
          title: Text
          description: What the ASR heard; empty when nothing was recognised.
        attachment_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Attachment Id
          description: Stored copy of the uploaded audio.
      type: object
      required:
      - text
      title: TranscribeResponse
    TutorMode:
      type: string
      enum:
      - dialogue
      - solution
      - marking
      - hint
      title: TutorMode
      description: 'TDD Appendix D. `dialogue` and `solution` differ in sampling (§6.5), `marking` also
        in

        grammar, `hint` also in which model answers (§7.6).'
    TutorReply:
      properties:
        session_id:
          type: string
          title: Session Id
        reply:
          type: string
          title: Reply
        mode:
          $ref: '#/components/schemas/TutorMode'
        verified:
          type: boolean
          title: Verified
          default: false
        citations:
          items:
            type: string
          type: array
          title: Citations
        queued:
          type: boolean
          title: Queued
          description: True when the turn waited for a slot (§8.2).
          default: false
        queue_position:
          type: integer
          title: Queue Position
          default: 0
        degradation_level:
          type: string
          title: Degradation Level
          description: Ladder level at the time of the turn (§5.3).
          default: L0
      type: object
      required:
      - session_id
      - reply
      - mode
      title: TutorReply
    TutoringMode:
      type: string
      enum:
      - socratic
      - subgoal
      title: TutoringMode
      description: The two MVP tutoring modes (ROADMAP 14 Jul scope).
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VerifyRequest:
      properties:
        expression:
          type: string
          title: Expression
          description: A claim/step to check, e.g. 'd/dx(x^2) == 2*x'.
        context:
          anyOf:
          - type: string
          - type: 'null'
          title: Context
          description: Optional assumptions/variable domains.
      type: object
      required:
      - expression
      title: VerifyRequest
    VerifyResponse:
      properties:
        verified:
          type: boolean
          title: Verified
        normalized:
          anyOf:
          - type: string
          - type: 'null'
          title: Normalized
          description: Canonical form the checker computed.
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
          description: Why it failed, when it did.
      type: object
      required:
      - verified
      title: VerifyResponse
    VisionReply:
      properties:
        session_id:
          type: string
          title: Session Id
        transcription:
          type: string
          title: Transcription
          description: What the model read from the image.
          default: ''
        analysis:
          type: string
          title: Analysis
          default: ''
        accepted:
          type: boolean
          title: Accepted
          description: False when the image guard or the ladder refused.
          default: true
        detail:
          type: string
          title: Detail
          description: Why it was refused, in words a student can act on.
          default: ''
        attachment_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Attachment Id
          description: Stored image attachment; pass in ChatRequest.attachment_ids.
      type: object
      required:
      - session_id
      title: VisionReply
