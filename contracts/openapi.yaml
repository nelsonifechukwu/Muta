openapi: 3.1.0
info:
  title: Muta — Offline Adaptive Tutor
  description: ADTC 2026. The only public surface is the versioned /v1 contract; every client — browser,
    phones, eval.py, CLI — speaks only /v1.
  version: 0.1.0
paths:
  /v1/health:
    get:
      tags:
      - ops
      summary: Health
      operationId: health_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/ready:
    get:
      tags:
      - ops
      summary: Ready
      description: 'Probes engine + db directly from config, never through `get_engine()` — readiness

        must report a down dependency, not hang constructing a store against it. Always HTTP

        200; the compose healthcheck greps the body for `"ready":true`.'
      operationId: ready_v1_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /v1/models:
    get:
      tags:
      - runtime
      summary: Models
      operationId: models_v1_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalogResponse'
  /v1/models/select:
    post:
      tags:
      - runtime
      summary: Select Model
      operationId: select_model_v1_models_select_post
      parameters:
      - name: X-Muta-CSRF
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Muta-Csrf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelSelectRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSelectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/resources:
    get:
      tags:
      - resources
      summary: Resources
      operationId: resources_v1_resources_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - resources
      summary: Resource Upload
      description: Durably accept one PDF, then prepare it outside the request thread.
      operationId: resource_upload_v1_resources_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_resource_upload_v1_resources_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningResource'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/resources/{resource_id}/retry:
    post:
      tags:
      - resources
      summary: Resource Retry
      operationId: resource_retry_v1_resources__resource_id__retry_post
      parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          title: Resource Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningResource'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/resources/{resource_id}:
    delete:
      tags:
      - resources
      summary: Resource Delete
      operationId: resource_delete_v1_resources__resource_id__delete
      parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          title: Resource Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDeleted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/resources/{resource_id}/content:
    get:
      tags:
      - resources
      summary: Resource Content
      operationId: resource_content_v1_resources__resource_id__content_get
      parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          title: Resource Id
      - name: token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      responses:
        '200':
          description: Inline PDF
          content:
            application/pdf: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/chat:
    post:
      tags:
      - tutor
      summary: Chat
      description: 'Multi-turn tutoring turn. Memory is keyed by `conversation_id`; omit it to start a

        new thread. The mode selects the system prompt (ROADMAP 18 Jul, stable-prefix design).'
      operationId: chat_v1_chat_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/chat/stream:
    post:
      tags:
      - tutor
      summary: Chat Stream
      description: Backwards-compatible streaming start; disconnecting no longer cancels inference.
      operationId: chat_stream_v1_chat_stream_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE token stream
          content:
            application/json:
              schema: {}
            text/event-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/chat/generations:
    post:
      tags:
      - tutor
      summary: Generation Start
      description: Start a durable browser turn and return its ids before subscribing to tokens.
      operationId: generation_start_v1_chat_generations_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationStarted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - tutor
      summary: Generation List
      description: List the caller's live jobs so a refreshed UI can reconnect to each one.
      operationId: generation_list_v1_chat_generations_get
      parameters:
      - name: client_request_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Request Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/chat/generations/{job_id}/stream:
    get:
      tags:
      - tutor
      summary: Generation Stream
      description: Replay and tail a live or recently-completed job from a frame offset.
      operationId: generation_stream_v1_chat_generations__job_id__stream_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: after
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: After
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      responses:
        '200':
          description: SSE token stream
          content:
            application/json:
              schema: {}
            text/event-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/chat/generations/{job_id}:
    delete:
      tags:
      - tutor
      summary: Generation Stop
      description: Explicit Stop is the only browser action that cancels a server-owned generation.
      operationId: generation_stop_v1_chat_generations__job_id__delete
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationStopped'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/settings:
    get:
      tags:
      - conversations
      summary: User Settings
      description: Return private learner preferences, with contract defaults for an untouched account.
      operationId: user_settings_v1_settings_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - conversations
      summary: User Settings Update
      description: Atomically update supplied settings while preserving sibling and future keys.
      operationId: user_settings_update_v1_settings_put
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettings'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/power/status:
    get:
      tags:
      - runtime
      summary: Power Status
      description: Power state of the serving laptop, not the browser/phone making this request.
      operationId: power_status_v1_power_status_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowerStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/conversations:
    get:
      tags:
      - conversations
      summary: Conversations
      description: 'A student''s threads, most recently active first — the UI sidebar. A caller only sees

        their own threads; the query id must match the authenticated identity.'
      operationId: conversations_v1_conversations_get
      parameters:
      - name: student_id
        in: query
        required: true
        schema:
          type: string
          title: Student Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/conversations/{conversation_id}/messages:
    get:
      tags:
      - conversations
      summary: Conversation Messages
      description: 'Full history with attachment refs — how the UI reloads a thread after a restart. Scoped

        to the owner: a thread the caller does not own is indistinguishable from a missing one.'
      operationId: conversation_messages_v1_conversations__conversation_id__messages_get
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/conversations/{conversation_id}/telemetry:
    get:
      tags:
      - ops
      summary: Conversation Telemetry
      description: One-shot telemetry snapshot (curl-able twin of the SSE stream below).
      operationId: conversation_telemetry_v1_conversations__conversation_id__telemetry_get
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetrySnapshot'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/conversations/{conversation_id}/telemetry/stream:
    get:
      tags:
      - ops
      summary: Conversation Telemetry Stream
      description: '1 Hz telemetry SSE. Async generator on purpose: a sync generator would pin a

        threadpool thread per open strip. GET, so the browser''s native EventSource works.'
      operationId: conversation_telemetry_stream_v1_conversations__conversation_id__telemetry_stream_get
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      responses:
        '200':
          description: 1 Hz SSE telemetry
          content:
            application/json:
              schema: {}
            text/event-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/conversations/{conversation_id}:
    delete:
      tags:
      - conversations
      summary: Conversation Delete
      description: 'Delete one of the caller''s own threads. 404 (not a false success) when the caller
        does

        not own it or it does not exist — a client cannot destroy another student''s history.


        Deletion is also a server-side generation barrier: another tab/device cannot keep a reply

        running, or start a new one, while the durable conversation rows are being removed.'
      operationId: conversation_delete_v1_conversations__conversation_id__delete
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDeleted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/conversations/{conversation_id}/pin:
    put:
      tags:
      - conversations
      summary: Conversation Pin
      description: 'Pin or unpin one of the caller''s own threads without exposing whether another

        learner''s identifier exists.'
      operationId: conversation_pin_v1_conversations__conversation_id__pin_put
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationPinRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPinned'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/attachments/{attachment_id}:
    get:
      tags:
      - conversations
      summary: Attachment
      description: 'Serve an attachment the caller owns. Ownership is checked at the store (owner or the

        owner of the linked conversation); a miss is a 404, so ids stay non-probeable. Served as an

        inert `nosniff` download with a whitelisted content type (never the client-set one).'
      operationId: attachment_v1_attachments__attachment_id__get
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: integer
          title: Attachment Id
      - name: token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: muta_share_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Muta Share Session
      responses:
        '200':
          description: Raw bytes
          content:
            application/octet-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/session:
    post:
      tags:
      - ops
      summary: Auth Session
      description: 'Mint a bearer token for a per-device learner id. With MUTA_AUTH_SECRET set the token
        is

        HMAC-signed (unforgeable); without it the token is the id itself (opaque per-device

        secret). Native loopback mode replaces port-scoped browser ids with one persistent operator

        id. The client sends the token as `Authorization: Bearer <token>` on data endpoints.'
      operationId: auth_session_v1_auth_session_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
