components:
  schemas:
    AnswerCheckRequest:
      properties:
        candidate:
          type: string
          title: Candidate
          description: The answer to check — bare, boxed, or inside prose.
        expected:
          type: string
          title: Expected
        tolerance:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Tolerance
          description: Relative tolerance; 0 = exact.
          default: 0.0
      type: object
      required:
      - candidate
      - expected
      title: AnswerCheckRequest
    AnswerCheckResponse:
      properties:
        verified:
          type: boolean
          title: Verified
        checked:
          type: boolean
          title: Checked
          description: False when no verdict was possible — not the same as wrong.
        normalized_candidate:
          type: string
          title: Normalized Candidate
          default: ''
        normalized_expected:
          type: string
          title: Normalized Expected
          default: ''
        detail:
          type: string
          title: Detail
          default: ''
      type: object
      required:
      - verified
      - checked
      title: AnswerCheckResponse
    AttachmentRef:
      properties:
        id:
          type: integer
          title: Id
        kind:
          type: string
          enum:
          - image
          - audio
          title: Kind
        mime:
          type: string
          title: Mime
      type: object
      required:
      - id
      - kind
      - mime
      title: AttachmentRef
    AuthTokenRequest:
      properties:
        student_id:
          type: string
          maxLength: 128
          title: Student Id
          description: The per-device learner id to bind.
      type: object
      required:
      - student_id
      title: AuthTokenRequest
    AuthTokenResponse:
      properties:
        student_id:
          type: string
          title: Student Id
        token:
          type: string
          title: Token
          description: 'Bearer token for the /v1 data endpoints. Send as `Authorization: Bearer <token>`
            (or `?token=` on attachment URLs). Opaque; treat as a per-device secret.'
        role:
          type: string
          enum:
          - host
          - member
          - legacy
          title: Role
          default: legacy
        csrf_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Csrf Token
      type: object
      required:
      - student_id
      - token
      title: AuthTokenResponse
    Body_audio_transcribe_v1_audio_transcribe_post:
      properties:
        audio:
          type: string
          contentMediaType: application/octet-stream
          title: Audio
        conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Id
        student_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Student Id
      type: object
      required:
      - audio
      title: Body_audio_transcribe_v1_audio_transcribe_post
    Body_image_upload_v1_attachments_images_post:
      properties:
        image:
          type: string
          contentMediaType: application/octet-stream
          title: Image
        conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Id
      type: object
      required:
      - image
      title: Body_image_upload_v1_attachments_images_post
    Body_resource_upload_v1_resources_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_resource_upload_v1_resources_post
    Body_tutor_vision_v1_tutor_vision_post:
      properties:
        session_id:
          type: string
          title: Session Id
        image:
          type: string
          contentMediaType: application/octet-stream
          title: Image
        conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Id
      type: object
      required:
      - session_id
      - image
      title: Body_tutor_vision_v1_tutor_vision_post
    ChatRequest:
      properties:
        student_id:
          type: string
          maxLength: 128
          title: Student Id
          description: Stable per-learner id; keys the learning twin.
        message:
          type: string
          maxLength: 8000
          title: Message
        conversation_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Conversation Id
          description: Omit to start a new thread; pass to continue one (multi-turn memory).
        client_request_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Client Request Id
          description: Browser-generated id for recovering a new-chat start across an immediate refresh.
        mode:
          $ref: '#/components/schemas/TutoringMode'
          default: socratic
        persona:
          $ref: '#/components/schemas/Persona'
          default: teacher
        subject:
          $ref: '#/components/schemas/Subject'
          default: math
        language:
          type: string
          maxLength: 16
          minLength: 2
          pattern: ^(?:auto|[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8}){0,2})$
          title: Language
          description: Preferred response language as 'auto' or a BCP 47 tag (for example en, de, sw,
            ar, pga-Latn). Auto follows the primary language in the latest user message. The gateway places
            this preference in the system prompt; it does not modify the user's message.
          default: en
        stream:
          type: boolean
          title: Stream
          description: When true the server replies with an SSE token stream instead.
          default: false
        thinking:
          anyOf:
          - type: string
            enum:
            - 'off'
            - auto
            - extended
          - type: 'null'
          title: Thinking
          description: 'Reasoning effort for this turn: ''off'' answers directly (no thinking, fastest),
            ''auto'' thinks first (default behaviour), ''extended'' thinks and gives a fuller answer.
            Null uses the server default.'
        regenerate:
          type: boolean
          title: Regenerate
          description: Re-answer the current last user turn WITHOUT adding a new user message. Used by
            'answer now' to replace an in-flight reply (e.g. skip the thinking phase).
          default: false
        use_web:
          type: boolean
          title: Use Web
          description: 'Opt-in web grounding: when the box is online and a search endpoint is configured,
            the answer is grounded with fresh snippets and their sources are returned. Ignored (silently)
            offline or unconfigured.'
          default: false
        use_rag:
          type: boolean
          title: Use Rag
          description: Opt-in retrieval over learner-owned resources. When enabled, resource_ids must
            identify the ready files selected with the chat @ picker.
          default: false
        resource_ids:
          items:
            type: string
            pattern: ^[0-9a-f]{32}$
          type: array
          maxItems: 8
          title: Resource Ids
          description: Opaque ids of learner-owned resources selected for this turn. Display names are
            never used for authorization or retrieval scope.
        attachment_ids:
          items:
            type: integer
          type: array
          maxItems: 32
          title: Attachment Ids
          description: Previously-uploaded attachments to link to this message.
      type: object
      required:
      - student_id
      - message
      title: ChatRequest
    ChatResponse:
      properties:
        student_id:
          type: string
          title: Student Id
        conversation_id:
          type: string
          title: Conversation Id
          description: Pass back in the next request to continue the thread.
        mode:
          $ref: '#/components/schemas/TutoringMode'
        reply:
          type: string
          title: Reply
          description: Assistant Markdown. A visual text turn may end with one fenced `muta-viz` JSON
            object; clients may validate/render it as documented in docs/api/EXAMPLES.md.
        verified:
          type: boolean
          title: Verified
          description: Whether math in the reply was checked by the `math` service.
          default: false
        citations:
          items:
            type: string
          type: array
          title: Citations
          description: RAG source references.
        resource_citations:
          items:
            $ref: '#/components/schemas/ResourceCitation'
          type: array
          title: Resource Citations
          description: Structured, server-owned citations into uploaded learner resources.
      type: object
      required:
      - student_id
      - conversation_id
      - mode
      - reply
      title: ChatResponse
    ChatTurn:
      properties:
        session_id:
          type: string
          title: Session Id
          description: One student's tutoring session; keys slot + twin.
        text:
          type: string
          maxLength: 4096
          title: Text
          description: 'Input cap per turn (S12: prompt-bomb guard).'
        mode:
          $ref: '#/components/schemas/TutorMode'
          default: dialogue
        lang:
          type: string
          maxLength: 16
          minLength: 2
          pattern: ^(?:auto|[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8}){0,2})$
          title: Lang
          description: Preferred response language as 'auto' or a BCP 47 tag. It is generation metadata
            and is never added to the learner's text.
          default: en
        student_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Student Id
          description: Defaults to session_id when omitted.
        stream:
          type: boolean
          title: Stream
          description: Kept for client symmetry. Token streaming has its own path — POST /v1/tutor/chat/stream
            (text/event-stream) — because one operation cannot honestly declare two response media types
            in the schema.
          default: false
      type: object
      required:
      - session_id
      - text
      title: ChatTurn
    ConversationDeleted:
      properties:
        id:
          type: string
          title: Id
        deleted:
          type: boolean
          title: Deleted
          default: true
      type: object
      required:
      - id
      title: ConversationDeleted
    ConversationList:
      properties:
        conversations:
          items:
            $ref: '#/components/schemas/ConversationOut'
          type: array
          title: Conversations
      type: object
      title: ConversationList
    ConversationOut:
      properties:
        id:
          type: string
          title: Id
        student_id:
          type: string
          title: Student Id
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Mode
        pinned:
          type: boolean
          title: Pinned
          default: false
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - id
      - student_id
      - created_at
      - updated_at
      title: ConversationOut
    ConversationPinRequest:
      properties:
        pinned:
          type: boolean
          title: Pinned
      type: object
      required:
      - pinned
      title: ConversationPinRequest
    ConversationPinned:
      properties:
        id:
          type: string
          title: Id
        pinned:
          type: boolean
          title: Pinned
      type: object
      required:
      - id
      - pinned
      title: ConversationPinned
    DiagnoseRequest:
      properties:
        student_id:
          type: string
          title: Student Id
        subject:
          $ref: '#/components/schemas/Subject'
          default: math
        topic:
          anyOf:
          - type: string
          - type: 'null'
          title: Topic
          description: Optional focus; otherwise diagnose broadly.
      type: object
      required:
      - student_id
      title: DiagnoseRequest
    DiagnoseResponse:
      properties:
        student_id:
          type: string
          title: Student Id
        weak_topics:
          items:
            type: string
          type: array
          title: Weak Topics
        plan:
          items:
            type: string
          type: array
          title: Plan
          description: Concrete next steps (e.g. 7-day).
      type: object
      required:
      - student_id
      title: DiagnoseResponse
    ExamAnswerRequest:
      properties:
        student_id:
          type: string
          maxLength: 128
          title: Student Id
        topic:
          type: string
          maxLength: 80
          title: Topic
          description: Curriculum topic the answer scores mastery on.
        candidate:
          type: string
          maxLength: 4096
          title: Candidate
          description: The student's submitted answer.
        expected:
          type: string
          maxLength: 4096
          title: Expected
          description: The correct answer (from the question).
        tolerance:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Tolerance
          default: 0.0
      type: object
      required:
      - student_id
      - topic
      - candidate
      - expected
      title: ExamAnswerRequest
      description: 'Score a student''s answer to a known question and move their mastery on that topic.
        The

        expected answer comes from the question bank, so this is real evidence — unlike free-chat

        volume, which never touches mastery.'
    GenerateQuestionRequest:
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
          default: math
        topic:
          type: string
          title: Topic
        difficulty:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Difficulty
          default: 3
        exam_board:
          type: string
          title: Exam Board
          default: WAEC
        count:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Count
          default: 1
      type: object
      required:
      - topic
      title: GenerateQuestionRequest
    GenerateQuestionResponse:
      properties:
        questions:
          items:
            $ref: '#/components/schemas/GeneratedQuestion'
          type: array
          title: Questions
      type: object
      title: GenerateQuestionResponse
    GeneratedQuestion:
      properties:
        question_text:
          type: string
          title: Question Text
        options:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Options
          description: Present for objective (Paper 1) items.
        correct_answer:
          type: string
          title: Correct Answer
        worked_solution:
          type: string
          title: Worked Solution
        marking_scheme:
          anyOf:
          - type: string
          - type: 'null'
          title: Marking Scheme
          description: Method + answer marks (Paper 2).
        topic_tags:
          items:
            type: string
          type: array
          title: Topic Tags
        difficulty:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Difficulty
          default: 3
      type: object
      required:
      - question_text
      - correct_answer
      - worked_solution
      title: GeneratedQuestion
    GenerationList:
      properties:
        generations:
          items:
            $ref: '#/components/schemas/GenerationStatus'
          type: array
          title: Generations
      type: object
      title: GenerationList
    GenerationStarted:
      properties:
        job_id:
          type: string
          title: Job Id
        conversation_id:
          type: string
          title: Conversation Id
        client_request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Request Id
        state:
          type: string
          enum:
          - queued
          - running
          title: State
          default: running
        queue_position:
          type: integer
          title: Queue Position
          default: 0
      type: object
      required:
      - job_id
      - conversation_id
      title: GenerationStarted
      description: A server-owned generation that can be re-subscribed after browser navigation.
    GenerationStatus:
      properties:
        job_id:
          type: string
          title: Job Id
        conversation_id:
          type: string
          title: Conversation Id
        state:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - stopped
          title: State
        created_at:
          type: string
          title: Created At
        client_request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Request Id
        queue_position:
          type: integer
          title: Queue Position
          default: 0
      type: object
      required:
      - job_id
      - conversation_id
      - state
      - created_at
      title: GenerationStatus
    GenerationStopped:
      properties:
        job_id:
          type: string
          title: Job Id
        stopping:
          type: boolean
          title: Stopping
      type: object
      required:
      - job_id
      - stopping
      title: GenerationStopped
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        service:
          type: string
          title: Service
        version:
          type: string
          title: Version
          description: Semantic version of the running build.
          default: 0.0.0
        git_sha:
          type: string
          title: Git Sha
          description: Commit the running image was built from.
          default: unknown
      type: object
      required:
      - service
      title: HealthResponse
    ImageUploadReply:
      properties:
        attachment_id:
          type: integer
          title: Attachment Id
        kind:
          type: string
          const: image
          title: Kind
          default: image
        mime:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
          title: Mime
        width:
          type: integer
          minimum: 1.0
          title: Width
        height:
          type: integer
          minimum: 1.0
          title: Height
      type: object
      required:
      - attachment_id
      - mime
      - width
      - height
      title: ImageUploadReply
    LearningResource:
      properties:
        id:
          type: string
          pattern: ^[0-9a-f]{32}$
          title: Id
        name:
          type: string
          title: Name
        mime:
          type: string
          const: application/pdf
          title: Mime
          default: application/pdf
        status:
          type: string
          enum:
          - processing
          - ready
          - failed
          title: Status
        page_count:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Page Count
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - id
      - name
      - status
      - created_at
      - updated_at
      title: LearningResource
    MasteryResponse:
      properties:
        student_id:
          type: string
          title: Student Id
        subject:
          $ref: '#/components/schemas/Subject'
        mastery:
          additionalProperties:
            type: number
          type: object
          title: Mastery
          description: topic_id -> mastery in [0, 1] on the curriculum DAG.
        next_topic:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Topic
          description: Next-best lesson given prerequisites.
      type: object
      required:
      - student_id
      - subject
      title: MasteryResponse
    MessageList:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
        messages:
          items:
            $ref: '#/components/schemas/MessageOut'
          type: array
          title: Messages
      type: object
      required:
      - conversation_id
      title: MessageList
    MessageOut:
      properties:
        id:
          type: integer
          title: Id
        role:
          type: string
          title: Role
        content:
          type: string
          title: Content
          description: Persisted message text. Assistant messages may include the fenced `muta-viz` protocol
            described in docs/api/EXAMPLES.md.
        created_at:
          type: string
          title: Created At
        completion_state:
          anyOf:
          - type: string
            enum:
            - complete
            - streaming
            - failed
            - stopped
          - type: 'null'
          title: Completion State
          description: How an assistant row ended. Null is a legacy completed row; streaming means a persisted
            partial whose owning process ended before terminal settlement.
        attachments:
          items:
            $ref: '#/components/schemas/AttachmentRef'
          type: array
          title: Attachments
        resource_citations:
          items:
            $ref: '#/components/schemas/ResourceCitation'
          type: array
          title: Resource Citations
      type: object
      required:
      - id
      - role
      - content
      - created_at
      title: MessageOut
    ModelBackend:
      properties:
        id:
          type: string
          title: Id
        label:
          type: string
          title: Label
        kind:
          type: string
          enum:
          - local
          - cloud
          title: Kind
        description:
          type: string
          title: Description
        available:
          type: boolean
          title: Available
        active:
          type: boolean
          title: Active
        disabled_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Disabled Reason
        size_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size Bytes
        arc_easy:
          anyOf:
          - type: number
          - type: 'null'
          title: Arc Easy
        audit_proxy_tps:
          anyOf:
          - type: number
          - type: 'null'
          title: Audit Proxy Tps
        recommended:
          type: boolean
          title: Recommended
          default: false
        user_added:
          type: boolean
          title: User Added
          description: True for an operator-supplied GGUF discovered below models/custom.
          default: false
        supports_images:
          type: boolean
          title: Supports Images
          description: True only when this model's verified projector is installed.
          default: false
        image_input_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Input Reason
          description: Why image input is unavailable while text inference can still work.
      type: object
      required:
      - id
      - label
      - kind
      - description
      - available
      - active
      title: ModelBackend
      description: One safe backend from the local registry; browser clients never send paths.
    ModelCatalogResponse:
      properties:
        active_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Active Id
        switching:
          type: boolean
          title: Switching
          default: false
        selection_enabled:
          type: boolean
          title: Selection Enabled
          default: false
        models:
          items:
            $ref: '#/components/schemas/ModelBackend'
          type: array
          title: Models
      type: object
      title: ModelCatalogResponse
    ModelSelectRequest:
      properties:
        model_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Model Id
      type: object
      required:
      - model_id
      title: ModelSelectRequest
    ModelSelectResponse:
      properties:
        active_id:
          anyOf:
