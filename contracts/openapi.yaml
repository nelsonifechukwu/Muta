            schema:
              $ref: '#/components/schemas/ChatTurn'
      responses:
        '200':
          description: SSE token stream
          content:
            application/json:
              schema: {}
            text/event-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
