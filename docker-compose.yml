# Muta — 3-container topology: db → backend (llama-server + gateway) → frontend (nginx).
# `./run.sh` is the front door; this file is the source of truth for the wiring.
# All services are linux/amd64 — the shape that matches the compiled engine.

services:
  db:
    # Digest-pinned (multi-arch manifest list, resolved 2026-08-08): another project's
    # arm64 pull of the bare tag clobbered platform resolution on 2026-08-07 and took
    # the whole boot down. A digest resolves per-platform and no neighbor can move it.
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    platform: linux/amd64
    environment:
      POSTGRES_USER: muta
      POSTGRES_PASSWORD: muta
      POSTGRES_DB: muta
    volumes:
      - muta-pgdata:/var/lib/postgresql/data
    ports:
      # Published for host-side dev/tests (runtime/tests use MUTA_TEST_DB_URL against it).
      # 15432 not 5432 so a host Postgres never collides.
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muta -d muta"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    platform: linux/amd64
    # tini as PID 1: reaps orphaned engine/vision grandchildren and forwards signals.
    init: true
    # LlamaServer.stop() waits up to 10s before SIGKILL; give the whole shutdown room.
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Direct curl/debug access; the frontend proxies /v1 for the browser.
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      MUTA_RT_AUTOSTART: "1"
      MUTA_RT_DB_URL: postgresql://muta:muta@db:5432/muta
      # Core model is hot-swappable via `./run.sh --model <path>` (which exports the
      # MUTA_MODEL_* interpolations); bare `docker compose up` serves the default.
      MUTA_RT_MODEL_DIR: ${MUTA_MODEL_DIR:-/app/models/core}
      MUTA_RT_MODEL_FILE: ${MUTA_MODEL_FILE:-Qwen3.5-4B-IQ4_XS.gguf}
      MUTA_RT_MODEL_ALIAS: ${MUTA_MODEL_ALIAS:-qwen3.5-4b}
      # ctx 2048 keeps core+draft RSS under the ladder's 4300 MiB core cap — at 4096 the
      # tree hits L4 and vision spawns are refused. Thinking on: the UI streams the chain
      # of thought live (collapsible, Claude-style), so the wait is visible, not a hang —
      # but on CPU/emulation the think phase still delays the first *answer* token; set
      # "0" to trade reasoning quality for latency.
      MUTA_RT_N_CTX: "2048"
      MUTA_RT_ENABLE_THINKING: "1"
      # Engine + 0.8B draft with the RSS ceilings applied: re-measure after boot and
      # record in bench/optimization-log.md. 5400 leaves room for vision on this 8 GiB VM.
      MUTA_CORE_CAP_MIB: "5400"
      # Weights are provisioned by run.sh (scripts/fetch_models.py); the gateway must never
      # surprise-download 2.6 GB itself.
      MUTA_RT_AUTO_DOWNLOAD: "0"
      # Engine flags now live in RuntimeConfig (runtime/config.py) — batch geometry,
      # q8_0 K-cache, reasoning budget 512, and the RSS ceilings (--parallel 2,
      # --ctx-checkpoints 2, --cache-ram 256, --kv-unified) are the defaults there.
      # Only deltas from those defaults belong here. NOTE: kv-unified + checkpoints 2
      # landed from the 2026-08-01 NATIVE sweep (RESULTS.md) and are not yet re-measured
      # under emulation — nor is kv-unified together with active draft speculation.
      # Threads: the VM's 10 vCPUs are shared with the gateway/db/nginx — decode is
      # bandwidth-bound and gains nothing from oversubscription (runtime/profiles.py
      # thread table rationale), prefill may use them all.
      # ⚠ APPLE-VM NUMBERS ONLY. On an x86 target box these pins are the measured
      # oversubscription collapse (-t 8 on a 4-core i5 is the "-t 10 → 4.4 tok/s"
      # regime, RESULTS.md 2026-08-01). For x86 deploys REMOVE both pins: llama.cpp's
      # own default (common_cpu_get_num_math) already picks physical P-cores on
      # bare-metal Linux — the right answer on every target CPU.
      MUTA_RT_N_THREADS: "8"
      MUTA_RT_N_THREADS_BATCH: "10"
      # Speculation draft: Qwen3.5-0.8B (fetch_models --with-draft). Qwen3-0.6B is NOT
      # usable — vocab 151936 vs the 4B's 248320, the engine rejects the pairing
      # (docs/engine-flags.md). Absent file -> speculation off, boot proceeds.
      MUTA_RT_DRAFT_MODEL: /app/models/draft/Qwen3.5-0.8B-Q4_K_M.gguf
      # Model load can take minutes under emulation; generous is free.
      MUTA_RT_STARTUP_TIMEOUT_S: "900"
      MUTA_RT_REQUEST_TIMEOUT_S: "600"
      # The vision spawn gets the same courtesy: 60 s covers a warm spawn on the target,
      # but a cold mmproj load under emulation can exceed it.
      MUTA_RT_VISION_STARTUP_S: "300"
      TUTOR_ROOT: /app
      # Provisioning runs `docker compose run backend python3.10 scripts/fetch_models.py`;
      # keeping the HF cache inside the mount makes it persistent and resumable.
      HF_HOME: /app/models/.cache/huggingface
    healthcheck:
      # /v1/ready is HTTP 200 even when degraded, so grep the body, not the status.
      # Window (start_period + retries×interval ≈ 900s) must cover
      # MUTA_RT_STARTUP_TIMEOUT_S — a first 4B load under emulation can take 10+ min.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/ready | grep -q '\"ready\":true'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    platform: linux/amd64
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      # nginx proxy target for /v1. run.sh --native overrides this to
      # host.docker.internal:8000 (the host gateway); docker mode keeps the service name.
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:8000}
    extra_hosts:
      # host.docker.internal resolves natively on Docker Desktop; host-gateway makes the
      # same name work on Linux engines so native mode is not macOS-only.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  muta-pgdata:
