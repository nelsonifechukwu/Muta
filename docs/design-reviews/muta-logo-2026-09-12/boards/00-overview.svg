<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Muta logo concept overview</title>
  <desc id="desc">Three identity directions compared: The Foothold, Stepline, and Common Ground.</desc>
  <defs>
    <style>
      .sans{font-family:Inter,Avenir Next,Arial,sans-serif}.serif{font-family:Iowan Old Style,Baskerville,Georgia,serif}
      .eyebrow{font-size:18px;font-weight:700;letter-spacing:3px}.title{font-size:58px;font-weight:600;letter-spacing:-2px}.body{font-size:22px}.small{font-size:17px}.score{font-size:28px;font-weight:700}.label{font-size:15px;font-weight:700;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#FAF9F5"/>
  <text x="70" y="68" class="sans eyebrow" fill="#AD4F31">MUTA / IDENTITY REVIEW 01</text>
  <text x="70" y="145" class="serif title" fill="#302D24">Three ways to make the square mean something.</text>
  <text x="70" y="188" class="sans body" fill="#625F57">Minimal, offline-native, and recognisable before it explains the category.</text>

  <g transform="translate(70 245)">
    <rect width="450" height="620" rx="28" fill="#FFFDF8" stroke="#DFDDD4"/>
    <rect x="40" y="38" width="182" height="182" rx="40" fill="#1D251F"/>
    <path d="M93 98v23c0 28 15 43 38 43s38-15 38-43V79" fill="none" stroke="#F5F1E7" stroke-width="23" stroke-linecap="square" stroke-linejoin="round"/>
    <rect x="122" y="184" width="18" height="18" rx="2" fill="#E58C69"/>
    <text x="40" y="278" class="sans label" fill="#AD4F31">A / RECOMMENDED</text>
    <text x="40" y="332" class="serif" font-size="44" font-weight="600" fill="#302D24">The Foothold</text>
    <text x="40" y="382" class="sans body" fill="#302D24">The learner's first solid idea</text>
    <text x="40" y="414" class="sans body" fill="#302D24">becomes the next step.</text>
    <line x1="40" y1="455" x2="410" y2="455" stroke="#DFDDD4"/>
    <text x="40" y="502" class="sans small" fill="#625F57">Name-linked · two shapes · 16 px ready</text>
    <text x="40" y="568" class="sans score" fill="#1D251F">DESIGN LEAD</text>
    <rect x="290" y="538" width="120" height="42" rx="21" fill="#DCE9E2"/>
    <text x="350" y="565" class="sans small" text-anchor="middle" font-weight="700" fill="#1D251F">CONDITIONAL</text>
  </g>

  <g transform="translate(575 245)">
    <rect width="450" height="620" rx="28" fill="#FFFDF8" stroke="#DFDDD4"/>
    <rect x="40" y="38" width="182" height="182" rx="40" fill="#1D251F"/>
    <rect x="70" y="143" width="37" height="37" rx="5" fill="#E58C69"/>
    <rect x="112" y="104" width="37" height="37" rx="5" fill="#F5F1E7"/>
    <rect x="154" y="65" width="37" height="37" rx="5" fill="#F5F1E7"/>
    <text x="40" y="278" class="sans label" fill="#AD4F31">B / ALTERNATIVE</text>
    <text x="40" y="332" class="serif" font-size="44" font-weight="600" fill="#302D24">Stepline</text>
    <text x="40" y="382" class="sans body" fill="#302D24">A quiet progression from one</text>
    <text x="40" y="414" class="sans body" fill="#302D24">known thing to the next.</text>
    <line x1="40" y1="455" x2="410" y2="455" stroke="#DFDDD4"/>
    <text x="40" y="502" class="sans small" fill="#625F57">Ultra-compact · clear · less ownable</text>
    <text x="40" y="568" class="sans score" fill="#1D251F">ALT 01</text>
  </g>

  <g transform="translate(1080 245)">
    <rect width="450" height="620" rx="28" fill="#FFFDF8" stroke="#DFDDD4"/>
    <rect x="40" y="38" width="182" height="182" rx="40" fill="#1D251F"/>
    <path d="M112 74h-12c-22 0-39 17-39 39v32c0 22 17 39 39 39h12" fill="none" stroke="#F5F1E7" stroke-width="20" stroke-linecap="square"/>
    <path d="M150 74h12c22 0 39 17 39 39v32c0 22-17 39-39 39h-12" fill="none" stroke="#F5F1E7" stroke-width="20" stroke-linecap="square"/>
    <rect x="119" y="119" width="24" height="24" rx="3" fill="#E58C69"/>
    <text x="40" y="278" class="sans label" fill="#AD4F31">C / ALTERNATIVE</text>
    <text x="40" y="332" class="serif" font-size="44" font-weight="600" fill="#302D24">Common Ground</text>
    <text x="40" y="382" class="sans body" fill="#302D24">Tutor and learner meet around</text>
    <text x="40" y="414" class="sans body" fill="#302D24">one shared idea.</text>
    <line x1="40" y1="455" x2="410" y2="455" stroke="#DFDDD4"/>
    <text x="40" y="502" class="sans small" fill="#625F57">Warmly relational · capture-icon risk</text>
    <text x="40" y="568" class="sans score" fill="#1D251F">ALT 02</text>
  </g>
  <text x="70" y="930" class="sans small" fill="#625F57">Qualitative review only · name and device-mark clearance required before production approval.</text>
</svg>
