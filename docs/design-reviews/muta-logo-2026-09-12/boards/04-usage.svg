<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Muta Foothold logo usage guidance</title>
  <desc id="desc">Clear-space, background, minimum-size, and incorrect-use guidance.</desc>
  <defs><style>.sans{font-family:Inter,Avenir Next,Arial,sans-serif}.serif{font-family:Iowan Old Style,Baskerville,Georgia,serif}.eye{font-size:17px;font-weight:700;letter-spacing:3px}.h1{font-size:62px;font-weight:600}.body{font-size:19px}.label{font-size:15px;font-weight:700;letter-spacing:2px}</style></defs>
  <rect width="1600" height="1000" fill="#FAF9F5"/>
  <text x="70" y="68" class="sans eye" fill="#AD4F31">A / THE FOOTHOLD / USAGE</text>
  <text x="70" y="142" class="serif h1" fill="#302D24">Give the foothold room to work.</text>

  <g transform="translate(70 220)">
    <text class="sans label" fill="#625F57">CLEAR SPACE</text>
    <rect x="0" y="35" width="520" height="300" rx="20" fill="#FFFDF8" stroke="#DFDDD4" stroke-dasharray="8 8"/>
    <rect x="102" y="91" width="18" height="18" rx="2" fill="#AD4F31" opacity=".15"/>
    <text x="108" y="82" class="sans body" fill="#AD4F31">x</text>
    <text x="120" y="255" class="serif" font-size="120" font-weight="600" fill="#302D24">Muta.</text>
    <rect x="242" y="277" width="18" height="18" rx="1.5" fill="#AD4F31"/>
    <path d="M102 122H508M102 322H508M102 122V322M508 122V322" fill="none" stroke="#AD4F31" stroke-width="1.5"/>
    <text x="0" y="372" class="sans body" fill="#625F57">≥ 1x around; ≥ 1.5x below the wordmark.</text>
  </g>

  <g transform="translate(650 220)">
    <text class="sans label" fill="#625F57">APPROVED BACKGROUNDS</text>
    <rect x="0" y="35" width="390" height="150" rx="20" fill="#FFFDF8" stroke="#DFDDD4"/>
    <path d="M53 85v19c0 24 13 37 34 37s34-13 34-37V68" fill="none" stroke="#1D251F" stroke-width="21" stroke-linecap="square"/><rect x="79" y="154" width="16" height="16" rx="1.5" fill="#AD4F31"/>
    <text x="160" y="125" class="serif" font-size="58" font-weight="600" fill="#302D24">Muta.</text>
    <rect x="0" y="205" width="390" height="150" rx="20" fill="#1D251F"/>
    <path d="M53 255v19c0 24 13 37 34 37s34-13 34-37V238" fill="none" stroke="#F5F1E7" stroke-width="21" stroke-linecap="square"/><rect x="79" y="324" width="16" height="16" rx="1.5" fill="#E58C69"/>
    <text x="160" y="295" class="serif" font-size="58" font-weight="600" fill="#F5F1E7">Muta.</text>
  </g>

  <g transform="translate(1110 220)">
    <text class="sans label" fill="#625F57">MINIMUMS</text>
    <text x="0" y="82" class="sans body" fill="#302D24">Wordmark</text><text x="190" y="82" class="sans body" font-weight="700" fill="#302D24">96 px / 24 mm</text>
    <line x1="0" y1="102" x2="390" y2="102" stroke="#DFDDD4"/>
    <text x="0" y="150" class="sans body" fill="#302D24">Standalone mark</text><text x="190" y="150" class="sans body" font-weight="700" fill="#302D24">24 px</text>
    <line x1="0" y1="170" x2="390" y2="170" stroke="#DFDDD4"/>
    <text x="0" y="218" class="sans body" fill="#302D24">Optical favicon</text><text x="190" y="218" class="sans body" font-weight="700" fill="#302D24">16 px</text>
    <line x1="0" y1="238" x2="390" y2="238" stroke="#DFDDD4"/>
    <text x="0" y="286" class="sans body" fill="#302D24">Clear-space unit x</text><text x="190" y="286" class="sans body" font-weight="700" fill="#302D24">foothold width</text>
  </g>

  <line x1="70" y1="650" x2="1530" y2="650" stroke="#DFDDD4"/>
  <text x="70" y="700" class="sans label" fill="#625F57">NEVER</text>
  <g transform="translate(70 744)"><rect width="280" height="150" rx="18" fill="#FFFDF8" stroke="#DFDDD4"/><g transform="translate(96 20) rotate(16 44 55)"><path d="M18 5v36c0 24 13 37 34 37s34-13 34-37V5" fill="none" stroke="#1D251F" stroke-width="18" stroke-linecap="square"/><rect x="45" y="92" width="14" height="14" fill="#AD4F31"/></g><text x="140" y="135" class="sans body" text-anchor="middle" fill="#625F57">Rotate</text></g>
  <g transform="translate(380 744)"><rect width="280" height="150" rx="18" fill="#FFFDF8" stroke="#DFDDD4"/><path d="M88 25v36c0 24 13 37 34 37s34-13 34-37V25" fill="none" stroke="#1D251F" stroke-width="18" stroke-linecap="square"/><path d="M116 111l7-14 7 14-7 14z" fill="#E58C69"/><text x="140" y="135" class="sans body" text-anchor="middle" fill="#625F57">Turn it into a cube</text></g>
  <g transform="translate(690 744)"><rect width="280" height="150" rx="18" fill="#FFFDF8" stroke="#DFDDD4"/><path d="M88 25v36c0 24 13 37 34 37s34-13 34-37V25" fill="none" stroke="#1D251F" stroke-width="18" stroke-linecap="square"/><rect x="115" y="111" width="14" height="14" fill="#397F78"/><text x="140" y="135" class="sans body" text-anchor="middle" fill="#625F57">Recolour</text></g>
  <g transform="translate(1000 744)"><rect width="280" height="150" rx="18" fill="#B8A083"/><path d="M88 25v36c0 24 13 37 34 37s34-13 34-37V25" fill="none" stroke="#AD4F31" stroke-width="18" stroke-linecap="square"/><rect x="115" y="111" width="14" height="14" fill="#E58C69"/><text x="140" y="135" class="sans body" text-anchor="middle" fill="#302D24">Lose contrast</text></g>
</svg>
