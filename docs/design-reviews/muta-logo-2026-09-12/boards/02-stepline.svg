<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Muta Stepline identity board</title>
  <desc id="desc">An alternative identity using three rising learning tiles.</desc>
  <defs><style>.sans{font-family:Inter,Avenir Next,Arial,sans-serif}.serif{font-family:Iowan Old Style,Baskerville,Georgia,serif}.eye{font-size:17px;font-weight:700;letter-spacing:3px}.h1{font-size:66px;font-weight:600}.body{font-size:20px}.label{font-size:15px;font-weight:700;letter-spacing:2px}</style></defs>
  <rect width="1600" height="1000" fill="#FAF9F5"/>
  <text x="70" y="68" class="sans eye" fill="#AD4F31">B / STEPLINE / ALTERNATIVE</text>
  <text x="70" y="145" class="serif h1" fill="#302D24">Make progress visible.</text>
  <text x="70" y="188" class="sans body" fill="#625F57">Three equal tiles turn one known thing into a simple upward rhythm.</text>
  <rect x="70" y="250" width="410" height="410" rx="90" fill="#1D251F"/>
  <rect x="148" y="493" width="78" height="78" rx="10" fill="#E58C69"/>
  <rect x="236" y="405" width="78" height="78" rx="10" fill="#F5F1E7"/>
  <rect x="324" y="317" width="78" height="78" rx="10" fill="#F5F1E7"/>
  <g transform="translate(570 330)">
    <g transform="translate(0 28)"><rect x="0" y="74" width="28" height="28" rx="4" fill="#AD4F31"/><rect x="34" y="40" width="28" height="28" rx="4" fill="#1D251F"/><rect x="68" y="6" width="28" height="28" rx="4" fill="#1D251F"/></g>
    <text x="130" y="110" class="sans" font-size="132" font-weight="650" letter-spacing="-5" fill="#302D24">muta</text>
    <text x="132" y="168" class="sans label" fill="#625F57">GEOMETRIC LOWERCASE LOCKUP</text>
  </g>
  <line x1="70" y1="740" x2="1530" y2="740" stroke="#DFDDD4"/>
  <g transform="translate(70 790)"><text class="sans label" fill="#625F57">STRENGTH</text><text y="42" class="sans body" fill="#302D24">Exceptional favicon clarity; progress reads immediately.</text></g>
  <g transform="translate(610 790)"><text class="sans label" fill="#625F57">RISK</text><text y="42" class="sans body" fill="#302D24">Rising blocks are common in analytics and finance.</text></g>
  <g transform="translate(1160 790)"><text class="sans label" fill="#625F57">STATUS</text><text y="54" class="sans" font-size="44" font-weight="700" fill="#1D251F">ALT 01</text></g>
</svg>
