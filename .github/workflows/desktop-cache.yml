name: desktop-cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop-cache.yml"
      - ".github/workflows/desktop-packages.yml"
      - ".github/workflows/desktop-release.yml"
      - "scripts/desktop_cache_changes.py"
      - "scripts/build_desktop_native.sh"
      - "scripts/verify_desktop_native.sh"
      - "scripts/desktop_native_pins.env"
      - "scripts/prepare_desktop_models.sh"
      - "scripts/verify_desktop_models.py"
      - "scripts/fetch_models.py"
      - "scripts/fetch_models.sh"
      - "scripts/model_specs.py"
      - "scripts/build_ui_dist.py"
      - "scripts/build_desktop.py"
      - "scripts/freeze_desktop_gateway.py"
      - "scripts/desktop_cache_key.py"
      - "models/pins.lock.json"
      - "runtime/model-catalog.json"
      - "muta-iq/download_model.sh"
      - "muta-iq/fetch_qwen25.sh"
      - "muta-iq/opt/scripts/**"
      - "muta-iq/opt/eval/system_prompt.txt"
      - "ui/*.html"
      - "ui/*.css"
      - "ui/*.js"
      - "ui/VISUALIZATION-LICENSES.txt"
      - "ui/vendor/viz/**"
      - "pyproject.toml"
      - "bench/sampler.py"
      - "contracts/**"
      - "desktop/backend_entry.py"
      - "desktop/pyinstaller/**"
      - "orchestrator/**"
      - "runtime/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-cache-main
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      models: ${{ steps.classify.outputs.models }}
      ui: ${{ steps.classify.outputs.ui }}
      native: ${{ steps.classify.outputs.native }}
      gateway: ${{ steps.classify.outputs.gateway }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: classify
        name: Select cache layers changed by this push
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python scripts/desktop_cache_changes.py --all >> "$GITHUB_OUTPUT"
          elif git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" \
              | python scripts/desktop_cache_changes.py >> "$GITHUB_OUTPUT"
          else
            git ls-tree -r --name-only "$GITHUB_SHA" \
              | python scripts/desktop_cache_changes.py >> "$GITHUB_OUTPUT"
          fi

  models:
    needs: changes
    if: needs.changes.outputs.models == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install platform-independent build dependencies
        run: python -m pip install -e ".[desktop]"
      - id: model-cache
        name: Restore verified desktop models
        uses: actions/cache@v4
        with:
          path: |
            muta-iq/model/Muta-Tutor-Qwen2.5-1.5B-Finetuned-Q4_K_M.gguf
            muta-iq/model/muta-tutor-qwen3.5-0.8b-q4_0.gguf
            models/mmproj/
            models/asr/
            models/tts/
            models/embed/
            models/LICENSES/
            models/MANIFEST.json
          key: >-
            desktop-models-v2-${{ hashFiles('scripts/prepare_desktop_models.sh',
            'scripts/verify_desktop_models.py', 'scripts/fetch_models.sh',
            'scripts/fetch_models.py', 'scripts/model_specs.py', 'models/pins.lock.json',
            'runtime/model-catalog.json', 'muta-iq/download_model.sh', 'muta-iq/fetch_qwen25.sh',
            'muta-iq/opt/scripts/**', 'muta-iq/opt/eval/system_prompt.txt') }}
      - name: Provision product models on cache miss
        if: steps.model-cache.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/prepare_desktop_models.sh
      - name: Verify cached product models
        run: python scripts/verify_desktop_models.py

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline UI build dependencies
        run: python -m pip install -e ".[desktop]"
      - id: ui-cache
        name: Restore offline UI
        uses: actions/cache@v4
        with:
          path: ui/dist
          key: >-
            desktop-ui-v2-${{ hashFiles('scripts/build_ui_dist.py', 'ui/*.html', 'ui/*.css',
            'ui/*.js', 'ui/VISUALIZATION-LICENSES.txt', 'ui/vendor/viz/**') }}
      - name: Build offline UI on cache miss
        if: steps.ui-cache.outputs.cache-hit != 'true'
        run: python scripts/build_ui_dist.py
      - name: Verify cached offline UI
        run: python scripts/build_ui_dist.py --verify-only

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target_os: linux
          - platform: windows-x86_64
            runner: windows-2022
            target_os: windows
          - platform: darwin-aarch64
            runner: macos-15
            target_os: macos
          - platform: darwin-x86_64
            runner: macos-15-intel
            target_os: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        if: matrix.target_os == 'windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make diffutils file
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm
      - id: native-cache
        name: Restore target-native sidecars
        uses: actions/cache@v4
        with:
          path: desktop/build/native
          key: >-
            desktop-native-v2-${{ matrix.platform }}-${{
            hashFiles('scripts/build_desktop_native.sh', 'scripts/verify_desktop_native.sh',
            'scripts/desktop_native_pins.env') }}
      - name: Install Linux native toolchain
        if: matrix.target_os == 'linux' && steps.native-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build nasm
      - name: Install macOS native toolchain
        if: matrix.target_os == 'macos' && steps.native-cache.outputs.cache-hit != 'true'
        run: brew install cmake ninja nasm
      - name: Build pinned Linux/macOS native sidecars
        if: matrix.target_os != 'windows' && steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/build_desktop_native.sh desktop/build/native
      - name: Build pinned Windows native sidecars
        if: matrix.target_os == 'windows' && steps.native-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build_desktop_native.sh desktop/build/native
      - name: Verify Linux/macOS native sidecars
        if: matrix.target_os != 'windows'
        shell: bash
        run: bash scripts/verify_desktop_native.sh desktop/build/native
      - name: Verify Windows native sidecars
        if: matrix.target_os == 'windows'
        shell: msys2 {0}
        run: bash scripts/verify_desktop_native.sh desktop/build/native

  gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            python_arch: x64
          - platform: windows-x86_64
            runner: windows-2022
            python_arch: x64
          - platform: darwin-aarch64
            runner: macos-15
            python_arch: arm64
          - platform: darwin-x86_64
            runner: macos-15-intel
            python_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install frozen gateway dependencies
        shell: bash
        run: python -m pip install -e ".[desktop]"
      - id: gateway-key
        name: Compute frozen gateway cache key
        shell: bash
        run: echo "key=$(python scripts/desktop_cache_key.py gateway)" >> "$GITHUB_OUTPUT"
      - id: gateway-cache
        name: Restore frozen Python gateway
        uses: actions/cache@v4
        with:
          path: desktop/build/gateway
          key: desktop-gateway-v2-${{ matrix.platform }}-${{ steps.gateway-key.outputs.key }}
      - name: Freeze Python gateway on cache miss
        if: steps.gateway-cache.outputs.cache-hit != 'true'
        shell: bash
        run: python scripts/freeze_desktop_gateway.py
      - name: Verify frozen Python gateway
        shell: bash
        run: python scripts/freeze_desktop_gateway.py --verify-only
