name: desktop-release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer to publish (for example 1.2.3)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - id: identity
        name: Validate immutable release identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            version="$INPUT_VERSION"
            tag="v$version"
          fi
          python scripts/prepare_tauri_release.py \
            --version "$version" \
            --pubkey 'dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDE3RjQ3RkJGMDJBMDc0QzIKUldUQ2RLQUN2My8wRjdCaDZEeFdMbFhjZWlybFpmS3JmSTZ1VER4Y2dyRjZmcjA3all1dW0xZ3cK' \
            --endpoint https://example.invalid/latest.json \
            --output "$RUNNER_TEMP/semver-check.json"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install and run release-relevant tests
        run: |
          python -m pip install -e ".[desktop,dev]"
          python -m pytest desktop scripts/test_stage_desktop.py scripts/test_desktop_release.py runtime/tests/test_paths.py

  inputs:
    needs: validate
    runs-on: ubuntu-22.04
    environment: desktop-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install model provisioning dependencies
        run: python -m pip install -e ".[desktop]"
      - id: model-cache
        name: Restore verified desktop models
        uses: actions/cache@v4
        with:
          path: |
            muta-iq/model/muta-tutor-qwen3.5-0.8b-q4_0.gguf
            models/mmproj/
            models/asr/
            models/tts/
            models/embed/
            models/LICENSES/
            models/MANIFEST.json
          key: >-
            desktop-models-v2-${{ hashFiles('scripts/prepare_desktop_models.sh',
            'scripts/verify_desktop_models.py', 'scripts/fetch_models.sh',
            'scripts/fetch_models.py', 'scripts/model_specs.py', 'models/pins.lock.json',
            'runtime/model-catalog.json', 'muta-iq/download_model.sh',
            'muta-iq/opt/scripts/**', 'muta-iq/opt/eval/system_prompt.txt') }}
      - name: Provision product models on cache miss
        if: steps.model-cache.outputs.cache-hit != 'true'
        env:
          MODEL_URL: ${{ secrets.MUTA_MODEL_URL }}
        run: bash scripts/prepare_desktop_models.sh
      - name: Verify cached product models
        run: python scripts/verify_desktop_models.py
      - id: ui-cache
        name: Restore offline UI
        uses: actions/cache@v4
        with:
          path: ui/dist
          key: >-
            desktop-ui-v2-${{ hashFiles('scripts/build_ui_dist.py', 'ui/*.html', 'ui/*.css',
            'ui/*.js', 'ui/VISUALIZATION-LICENSES.txt', 'ui/vendor/viz/**') }}
      - name: Build offline UI on cache miss
        if: steps.ui-cache.outputs.cache-hit != 'true'
        run: python scripts/build_ui_dist.py
      - name: Verify cached offline UI
        run: python scripts/build_ui_dist.py --verify-only
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-build-inputs
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            ui/dist/
            muta-iq/model/muta-tutor-qwen3.5-0.8b-q4_0.gguf
            models/mmproj/
            models/asr/
            models/tts/
            models/embed/
            models/LICENSES/
            models/MANIFEST.json
            models/pins.lock.json

  build:
    needs: [validate, inputs]
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target_os: linux
            target_arch: x86_64
            python_arch: x64
          - platform: windows-x86_64
            runner: windows-2022
            target_os: windows
            target_arch: x86_64
            python_arch: x64
          - platform: darwin-aarch64
            runner: macos-15
            target_os: macos
            target_arch: aarch64
            python_arch: arm64
          - platform: darwin-x86_64
            runner: macos-15-intel
            target_os: macos
            target_arch: x86_64
            python_arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      MUTA_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      MUTA_RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      MUTA_UPDATER_PUBLIC_KEY: ${{ vars.MUTA_UPDATER_PUBLIC_KEY }}
      MUTA_MODEL_PACK_PUBLIC_KEY: ${{ vars.MUTA_UPDATER_PUBLIC_KEY }}
      MUTA_UPDATER_ENABLED: "1"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      MUTA_DESKTOP_HEARTBEAT_URL: ${{ vars.MUTA_DESKTOP_HEARTBEAT_URL }}
      MUTA_DESKTOP_HEARTBEAT_INGEST_KEY: ${{ secrets.MUTA_DESKTOP_HEARTBEAT_INGEST_KEY }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-build-inputs
          path: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install Linux native dependencies
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm pkg-config file \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libasound2-dev
      - name: Install macOS native dependencies
        if: matrix.target_os == 'macos'
        run: brew install cmake ninja nasm
      - uses: msys2/setup-msys2@v2
        if: matrix.target_os == 'windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make diffutils file
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm
      - id: native-cache
        name: Restore target-native sidecars
        uses: actions/cache@v4
        with:
          path: desktop/build/native
          key: >-
            desktop-native-v2-${{ matrix.platform }}-${{
            hashFiles('scripts/build_desktop_native.sh', 'scripts/verify_desktop_native.sh',
            'scripts/desktop_native_pins.env') }}
      - name: Build pinned Linux/macOS native sidecars
        if: matrix.target_os != 'windows' && steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/build_desktop_native.sh desktop/build/native
      - name: Build pinned Windows native sidecars
        if: matrix.target_os == 'windows' && steps.native-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build_desktop_native.sh desktop/build/native
      - name: Verify Linux/macOS native sidecars
        if: matrix.target_os != 'windows'
        shell: bash
        run: bash scripts/verify_desktop_native.sh desktop/build/native
      - name: Verify Windows native sidecars
        if: matrix.target_os == 'windows'
        shell: msys2 {0}
        run: bash scripts/verify_desktop_native.sh desktop/build/native
      - name: Install Python dependencies
        shell: bash
        run: python -m pip install -e ".[desktop]"
      - id: gateway-key
        name: Compute frozen gateway cache key
        shell: bash
        run: echo "key=$(python scripts/desktop_cache_key.py gateway)" >> "$GITHUB_OUTPUT"
      - id: gateway-cache
        name: Restore frozen Python gateway
        uses: actions/cache@v4
        with:
          path: desktop/build/gateway
          key: desktop-gateway-v2-${{ matrix.platform }}-${{ steps.gateway-key.outputs.key }}
      - name: Verify restored frozen Python gateway
        if: steps.gateway-cache.outputs.cache-hit == 'true'
        shell: bash
        run: python scripts/freeze_desktop_gateway.py --verify-only
      - name: Require protected signing configuration
        shell: bash
        run: |
          test -n "$MUTA_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ "${{ matrix.target_os }}" = macos ]; then
            test -n "$APPLE_SIGNING_IDENTITY"
            test -n "$APPLE_CERTIFICATE_BASE64"
            test -n "$APPLE_ID"
            test -n "$APPLE_PASSWORD"
            test -n "$APPLE_TEAM_ID"
          fi
          if [ "${{ matrix.target_os }}" = windows ]; then
            test -n "$WINDOWS_CERTIFICATE_BASE64"
            test -n "$WINDOWS_CERTIFICATE_PASSWORD"
          fi
      - name: Import Apple Developer ID certificate
        if: matrix.target_os == 'macos'
        shell: bash
        run: |
          certificate="$RUNNER_TEMP/muta-developer-id.p12"
          keychain="$RUNNER_TEMP/muta-signing.keychain-db"
          python -c 'import base64,os,pathlib; pathlib.Path(os.environ["CERTIFICATE"]).write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE_BASE64"]))'
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
        env:
          CERTIFICATE: ${{ runner.temp }}/muta-developer-id.p12
      - name: Generate signed updater configuration
        shell: bash
        run: |
          python scripts/prepare_tauri_release.py \
            --version "$MUTA_RELEASE_VERSION" \
            --endpoint "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" \
            --output desktop/build/tauri.release.json
      - name: Build signed offline application
        shell: bash
        run: |
          reuse=()
          if [ "${{ steps.gateway-cache.outputs.cache-hit }}" = true ]; then
            reuse+=(--reuse-frozen-gateway)
          fi
          python scripts/build_desktop.py \
            --release \
            --engine-dir desktop/build/native \
            --include-optional-models \
            --version "$MUTA_RELEASE_VERSION" \
            --model-pack-id "muta-models-2026.08" \
            --tauri-config desktop/build/tauri.release.json \
            "${reuse[@]}"
      - name: Inspect staged artifact and dependency closure
        shell: bash
        run: |
          python scripts/inspect_desktop_artifact.py \
            --release \
            --app-resources desktop/build/app-resources \
            --gateway desktop/build/gateway \
            --model-pack desktop/build/model-pack \
            --target-os "${{ matrix.target_os }}" \
            --target-arch "${{ matrix.target_arch }}"
      - name: Verify macOS seal and notarization ticket
        if: matrix.target_os == 'macos'
        shell: bash
        run: |
          app=desktop/src-tauri/target/release/bundle/macos/Muta.app
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          dmg="$(find desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          xcrun stapler validate "$dmg"
      - name: Collect uniquely named release assets
        shell: bash
        run: |
          python scripts/collect_desktop_release.py \
            --platform "${{ matrix.platform }}" \
            --version "$MUTA_RELEASE_VERSION" \
            --bundle-root desktop/src-tauri/target/release/bundle \
            --offline-kit desktop/build/offline-kit \
            --output "desktop/release/${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: desktop/release/${{ matrix.platform }}/

  publish:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    environment: desktop-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: linux-x86_64, path: release-assets/linux-x86_64}
      - uses: actions/download-artifact@v4
        with: {name: windows-x86_64, path: release-assets/windows-x86_64}
      - uses: actions/download-artifact@v4
        with: {name: darwin-aarch64, path: release-assets/darwin-aarch64}
      - uses: actions/download-artifact@v4
        with: {name: darwin-x86_64, path: release-assets/darwin-x86_64}
      - name: Generate the signed static update index
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          python scripts/generate_latest_json.py \
            --version "$VERSION" \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --assets-root release-assets \
            --output release-assets/latest.json
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release already exists; refusing to overwrite $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" \
            release-assets/*/* \
            release-assets/latest.json \
            --target "$GITHUB_SHA" \
            --title "Muta $VERSION" \
            --generate-notes
