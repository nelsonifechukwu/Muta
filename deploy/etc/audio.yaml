# Audio configuration (TDD §6.6). Voices and languages are DATA, not code: adding Hausa TTS
# should be a line here plus a model file in the bundle, never a code change.
#
# Paths are relative to TUTOR_ROOT. Missing model dirs are not an error — the audio service
# reports the engine as unavailable and the gateway degrades to text (C-7: every failure
# mode ends at a working text tutor).

asr:
  engine: sherpa-onnx
  model_dir: models/asr/moonshine-tiny-en-int8
  # Streaming shape: 200 ms chunks in, incremental transcript out, finalise on VAD endpoint.
  chunk_seconds: 0.2
  sample_rate: 16000
  num_threads: 1
  decoding_method: greedy_search
  language: en
  vad:
    model: models/asr/silero-vad.onnx
    # An utterance ends after half a second of silence; 90 s is the hard cap, because a
    # forgotten open mic must not become an unbounded transcript (S12).
    trailing_silence_seconds: 0.5
    max_utterance_seconds: 90.0
    threshold: 0.5

tts:
  engine: piper           # D5: Piper everywhere; Kokoro is solo-demo only
  sample_rate: 24000
  num_threads: 1          # >1 helps Kokoro, not Piper [MEASURE: RTF at threads in {1,2}]
  voices:
    en:
      model: models/tts/piper/en_GB-alba-medium.onnx
      config: models/tts/piper/en_GB-alba-medium.onnx.json
    # Add a language by adding a voice; missing voice -> text-only reply with a notice (S8).
  premium:
    kokoro:
      model_dir: models/tts/kokoro
      profiles: [solo-demo]   # never resident in the classroom profile
