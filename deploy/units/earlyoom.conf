# /etc/default/earlyoom — sacrifice order under memory pressure (TDD §5.4).
#
# The core server is never the victim: killing it is a visible, disqualifying crash, while
# killing a renderer subprocess costs one diagram and falls back to a text description (S5).
# -m 4 / -s 100: act at 4% free RAM, 100% free swap (zram is a shock absorber, not budget).
EARLYOOM_ARGS=-m 4 -s 100 -r 60 --avoid '(^|/)llama-server-core($|\s)' --prefer '(renderer|sympy|matplotlib)'
