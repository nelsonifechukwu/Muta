# /etc/systemd/zram-generator.conf — 2 GiB lz4 swap-on-zram (TDD §5.4).
#
# Not budget: a shock absorber. Compressed swap converts ~1 GiB of cold anonymous memory
# into ~400 MiB physical at small CPU cost, which buys the degradation ladder time to act
# instead of the kernel acting for us. swappiness is raised because the pages we want swapped
# are anonymous (Python heaps, tool subprocesses) — never the mmap'd weight file, whose
# eviction would be paid back as major faults inside the decode loop.
[zram0]
zram-size = 2048
compression-algorithm = lz4
swap-priority = 100
