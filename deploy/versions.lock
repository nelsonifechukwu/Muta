# versions.lock — everything the bundle is built from (TDD T1, §11.1).
#
# Format is KEY=value so `source versions.lock` (shell) and `bundle.versions` (Python) read
# the same bytes. Empty value = NOT PINNED YET; any build step that needs it must refuse.
#
# Rule: a build that cannot prove it is compiling the pinned tree does not run. The 9 Aug
# native extraction has to reproduce these binaries exactly, and "close enough" is a
# reproducibility hole discovered on the target box, which is the worst place to find one.

# --- Inference engine, variant A (guaranteed; TDD §6.1) --------------------------------
LLAMA_CPP_REPO=https://github.com/ggml-org/llama.cpp.git
LLAMA_CPP_REF=b10035
LLAMA_CPP_COMMIT=602f828b4
# Build flags are NOT free-form: AVX2 baseline, AVX-512 forbidden (TDD C-1, DQ guard).
# Multi-word values are quoted: this file is `source`d by build.sh, and an unquoted list
# would be parsed as an assignment followed by a command — i.e. the lock would *run* its own
# build targets. (Found the hard way.)
LLAMA_BUILD_FLAGS="-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_AVX512=OFF -DGGML_FMA=ON -DGGML_F16C=ON -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release"
LLAMA_BUILD_TARGETS="llama-server llama-bench llama-quantize llama-cli"

# --- Inference engine, variant B (accelerant; gated on D4) -----------------------------
# Adopted only if it loads the core model AND beats variant A by >= 1.10x decode TPS on the
# target box. Unpinned until that bench exists — see TDD §14 D4.
IK_LLAMA_REPO=https://github.com/ikawrakow/ik_llama.cpp.git
IK_LLAMA_REF=

# --- Inference engine, variant C (Intel-conditional; gated on D4) ----------------------
# Preview backend; never the only binary shipped (TDD §16 risk row).
OPENVINO_VERSION=

# --- Audio (sherpa-onnx; TDD §6.6) -----------------------------------------------------
SHERPA_ONNX_REPO=https://github.com/k2-fsa/sherpa-onnx.git
SHERPA_ONNX_REF=

# --- Base / target OS ------------------------------------------------------------------
# TDD C-6 names Ubuntu 24.04 as the target; docker/dev.Dockerfile still builds on 22.04 (the
# ROADMAP-era pin). Both are recorded so the discrepancy is visible rather than assumed away;
# the clean-room selftest (TDD §11.4) runs on TARGET_OS_IMAGE.
DEV_BASE_IMAGE=ubuntu:22.04
DEV_BASE_DIGEST=sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982
TARGET_OS_IMAGE=ubuntu:24.04
TARGET_OS_DIGEST=

