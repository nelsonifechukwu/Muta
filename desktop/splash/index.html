<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
  <title>Starting Muta</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f1e7; color: #1d251f; }
    main { width: min(520px, calc(100vw - 48px)); text-align: center; }
    .logo { display: inline-grid; width: min(190px, 44vw); line-height: 0; }
    .logo img { grid-area: 1 / 1; display: block; width: 100%; height: auto; }
    .logo-dark { display: none !important; }
    p { max-width: 480px; margin: 28px auto 0; color: #5f665f; }
    #error { margin-top: 18px; padding: 12px; border-radius: 12px; color: #8b241c; background: #f7d8d4; text-align: left; white-space: pre-wrap; }
    @media (prefers-color-scheme: dark) {
      body { background: #191815; color: #f5f1e7; }
      p { color: #b9b3a8; }
      .logo-light { display: none !important; }
      .logo-dark { display: block !important; }
    }
  </style>
</head>
<body>
  <main>
    <span class="logo" role="img" aria-label="Muta"><img class="logo-light" src="brand/muta-stacked-on-light.svg" alt=""><img class="logo-dark" src="brand/muta-stacked-on-dark.svg" alt=""></span>
    <p id="status" role="status">the personal education companion for every student at every level. powered by AI.</p>
    <div id="error" role="alert" hidden></div>
  </main>
  <script src="splash.js"></script>
</body>
</html>
