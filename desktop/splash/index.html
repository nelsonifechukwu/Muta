<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
  <title>Starting Muta</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f1e7; color: #1d251f; }
    main { width: min(520px, calc(100vw - 48px)); text-align: center; }
    .wordmark { display: inline-block; color: currentColor; font: 600 64px/1 Georgia, serif; letter-spacing: -.05em; }
    .wordmark-u { position: relative; display: inline-block; }
    .wordmark-u i { position: absolute; left: 50%; bottom: -.2em; width: .16em; height: .16em; transform: translateX(-50%); background: #ad4f31; }
    p { max-width: 480px; margin: 28px auto 0; color: #5f665f; }
    #error { margin-top: 18px; padding: 12px; border-radius: 12px; color: #8b241c; background: #f7d8d4; text-align: left; white-space: pre-wrap; }
    @media (prefers-color-scheme: dark) { body { background:#172019; color:#f5f1e7; } p { color:#b9c0b9; } }
  </style>
</head>
<body>
  <main>
    <div class="wordmark" role="img" aria-label="Muta"><span aria-hidden="true">M<span class="wordmark-u">u<i></i></span>ta.</span></div>
    <p id="status" role="status">the personal education companion for every student at every level. powered by AI.</p>
    <div id="error" role="alert" hidden></div>
  </main>
  <script src="splash.js"></script>
</body>
</html>
