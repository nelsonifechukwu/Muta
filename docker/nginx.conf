# Frontend nginx: static UI + same-origin reverse proxy for the /v1 contract.
# Same-origin means no CORS anywhere; SSE needs buffering off; the voice loop needs
# WebSocket upgrade passthrough.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        # WS when upgrading, plain keepalive otherwise (the map above).
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # SSE: flush frames through instead of buffering a "complete" response.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Image guard allows 8 MiB; audio uploads can be larger. Default 1m would 413.
        client_max_body_size 32m;
    }

    location / {
        try_files $uri /index.html;
    }
}
