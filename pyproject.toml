[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muta"
version = "0.1.0"
description = "ADTC 2026 — offline adaptive math & science tutor (backend + /v1 API contract)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "huggingface_hub>=0.24",  # runtime model provisioning (folder default, HF fallback)
    "psutil>=5.9",  # bench/: RSS + process-tree sampling, matching the official profiler
    "python-multipart>=0.0.9",  # /v1/tutor/vision multipart upload (TDD §7.2)
    "psycopg[binary]>=3.2",  # conversations/attachments live in the Postgres container
    "psycopg-pool>=3.2",
    "sherpa-onnx>=1.10",  # Moonshine ASR + Silero VAD + Piper TTS (wheels-only in the image)
    # Deterministic tools (TDD §7.5). These run inside the sandbox subprocess, not in the
    # gateway, so their footprint is charged to the 300 MiB tool pool rather than to the
    # gateway's 600 MiB cap — but they must be in the bundle, hence core dependencies.
    "sympy>=1.12",  # answer verification
    "numpy>=1.26",  # renderer + flat index
    "matplotlib>=3.8",  # diagram rendering (Agg only, no display)
    "pillow>=10.0",  # image guard: downscale, EXIF strip (TDD §4.2)
    "pypdf>=5.0",  # learner-resource PDF extraction with physical page preservation
    "qrcode>=8.0",  # offline Host-mode LAN join QR (Pillow is already bundled above)
    "cryptography>=43.0",  # cross-platform offline Host-mode CA/certificate generation
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "schemathesis>=3.30",
    "rich>=13",  # bench/monitor.py HUD only — dev tooling
]
desktop = [
    "pyinstaller==6.22.2",
]

# One distribution, two import packages: the frozen contract and the app that serves it.
# Everything collapses into a single process at deploy (ROADMAP A.2) — hence one workspace,
# not five packages.
[tool.hatch.build.targets.wheel]
packages = ["bench", "contracts", "desktop", "orchestrator", "runtime"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]  # import sorting

[tool.pytest.ini_options]
# Tests live next to the code they cover (lane-owned), so discover across the packages.
testpaths = ["contracts", "orchestrator", "runtime", "bench", "scripts", "ui", "desktop"]
python_files = ["test_*.py"]
# Integration tests create a venv / hit the network; opt in with `pytest -m integration`.
addopts = "-q -m 'not integration' --ignore=desktop/build --ignore=desktop/src-tauri/target"
markers = [
    "integration: creates the profiler venv or hits the network; deselected by default",
]
